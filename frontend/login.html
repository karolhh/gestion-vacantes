<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión Vacantes</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="shared/styles.css">
    
    <style>
        body {
            background-color: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .brand-logo {
            font-size: 2rem;
            font-weight: 700;
            color: #0d6efd;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .nav-tabs .nav-link {
            font-weight: 600;
            color: #6c757d;
        }
        .nav-tabs .nav-link.active {
            color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-logo">
            <i class="bi bi-briefcase-fill me-2"></i>Gestión Vacantes
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                
                <!-- Pestañas -->
                <ul class="nav nav-tabs mb-4" id="tabs-auth" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="tab-login" data-bs-toggle="tab" data-bs-target="#panel-login" type="button" role="tab">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tab-registro" data-bs-toggle="tab" data-bs-target="#panel-registro" type="button" role="tab">
                            <i class="bi bi-person-plus me-1"></i> Registrarse
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="contenido-tabs">
                    
                    <!-- PANEL LOGIN -->
                    <div class="tab-pane fade show active" id="panel-login" role="tabpanel">
                        <form id="form-login">
                            <div class="mb-3">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="login-email" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="login-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="btn-login">
                                <i class="bi bi-box-arrow-in-right me-1"></i>
                                Ingresar
                            </button>
                        </form>
                    </div>

                    <!-- PANEL REGISTRO -->
                    <div class="tab-pane fade" id="panel-registro" role="tabpanel">
                        <form id="form-registro">
                            <div class="mb-3">
                                <label class="form-label">Nombre completo *</label>
                                <input type="text" class="form-control" id="reg-nombre" required maxlength="150">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo electrónico *</label>
                                <input type="email" class="form-control" id="reg-email" required maxlength="150">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Contraseña *</label>
                                    <input type="password" class="form-control" id="reg-password" required minlength="8">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Teléfono</label>
                                    <input type="text" class="form-control" id="reg-telefono" maxlength="20">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="reg-direccion" maxlength="255">
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="btn-registro">
                                <i class="bi bi-person-check me-1"></i>
                                Crear Cuenta
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none text-muted">
                <i class="bi bi-arrow-left me-1"></i> Volver al inicio
            </a>
        </div>
    </div>

    <!-- Contenedor de alertas flotantes -->
    <div id="alertas-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts compartidos -->
    <script src="shared/request.js"></script>
    <script src="shared/api.js"></script>
    
    <!-- Script de autenticación -->
    <script src="shared/auth.js"></script>
    
    <script>
        // Si ya hay sesión, redirigir
        if (Session.estaAutenticado()) {
            const rol = Session.obtenerRol();
            if (rol === 'ADMIN') window.location.href = 'admin/admin.html';
            else if (rol === 'RECLUTADOR') window.location.href = 'reclutador/reclutador.html';
            else if (rol === 'POSTULANTE') window.location.href = 'postulante/postulante.html';
        }

        // Si viene con #registro en la URL, abrir esa pestaña
        if (window.location.hash === '#registro') {
            new bootstrap.Tab(document.getElementById('tab-registro')).show();
        }
    </script>
</body>
</html>
